<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alpen Bank | Product Demonstration</title>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    rgba(0, 92, 185, 0.07),
                    transparent 35%
                ),
                #f7f9fc;

            color: #333;
        }


        /* =====================================
           HEADER
        ===================================== */

        header {

            height: 72px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;

            background: rgba(255,255,255,0.92);

            border-bottom: 1px solid #e7ebf0;
        }


        /* Small logo in header */

        .header-logo {

            height: 38px;
            width: auto;

            object-fit: contain;
        }


        .header-right {

            display: flex;
            align-items: center;
            gap: 9px;

            font-size: 12px;

            color: #77777b;

            letter-spacing: 1.2px;

            text-transform: uppercase;
        }


        .status-dot {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #3baf29;
        }



        /* =====================================
           MAIN
        ===================================== */

        main {

            min-height: calc(100vh - 72px);

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 50px 20px;
        }


        .container {

            width: 100%;

            max-width: 1100px;

            text-align: center;
        }



        /* =====================================
           TOP LABEL
        ===================================== */

        .eyebrow {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding: 8px 15px;

            border-radius: 50px;

            background: rgba(0, 92, 185, 0.06);

            border: 1px solid rgba(0, 92, 185, 0.12);

            color: #005cb9;

            font-size: 12px;

            font-weight: 600;

            letter-spacing: 1.8px;

            text-transform: uppercase;

            margin-bottom: 25px;
        }


        .eyebrow svg {

            width: 15px;
            height: 15px;
        }



        /* =====================================
           CENTER LOGO AREA
        ===================================== */

        .logo-area {

            width: 340px;
            height: 180px;

            margin: 0 auto 30px;

            background: #ffffff;

            border-radius: 22px;

            border: 1px solid #e1e6ec;

            display: flex;

            align-items: center;
            justify-content: center;

            position: relative;

            box-shadow:
                0 20px 55px rgba(0, 45, 90, 0.10);

            overflow: hidden;
        }


        /*
            =====================================
            YOUR LARGE LOGO GOES HERE
            =====================================

            Put your PNG in the same folder:

                logo.png

            Then this image will automatically
            appear in the center.
        */

        .logo-area img {

            max-width: 270px;

            max-height: 130px;

            width: auto;

            height: auto;

            object-fit: contain;
        }


        /*
            Decorative color line
        */

        .logo-area::after {

            content: "";

            position: absolute;

            bottom: 0;
            left: 0;

            width: 100%;
            height: 4px;

            background:
                linear-gradient(
                    90deg,
                    #005cb9 0%,
                    #005cb9 42%,
                    #3baf29 70%,
                    #ffa409 100%
                );
        }



        /* =====================================
           HEADING
        ===================================== */

        h1 {

            font-size: clamp(32px, 5vw, 52px);

            line-height: 1.1;

            font-weight: 650;

            color: #30343a;

            margin-bottom: 15px;
        }


        h1 span {

            color: #005cb9;
        }


        .description {

            max-width: 620px;

            margin: 0 auto;

            font-size: 16px;

            line-height: 1.7;

            color: #77777b;
        }



        /* =====================================
           INSURANCE ICONS
        ===================================== */

        .insurance-icons {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 45px;

            margin-top: 38px;

            margin-bottom: 38px;

            flex-wrap: wrap;
        }


        .insurance-item {

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 9px;

            color: #77777b;

            font-size: 11px;

            letter-spacing: 0.5px;
        }


        .icon {

            width: 48px;
            height: 48px;

            border-radius: 14px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #ffffff;

            border: 1px solid #e3e7ec;

            box-shadow:
                0 8px 22px rgba(0, 40, 80, 0.06);

            transition: 0.25s ease;
        }


        .icon svg {

            width: 21px;
            height: 21px;

            color: #005cb9;
        }


        .insurance-item:nth-child(2) .icon svg {
            color: #3baf29;
        }


        .insurance-item:nth-child(3) .icon svg {
            color: #ffa409;
        }


        .insurance-item:nth-child(4) .icon svg {
            color: #005cb9;
        }


        .insurance-item:nth-child(5) .icon svg {
            color: #3baf29;
        }


        .insurance-item:hover .icon {

            transform: translateY(-4px);

            box-shadow:
                0 12px 25px rgba(0, 40, 80, 0.12);
        }



        /* =====================================
           DEMO BUTTON
        ===================================== */

        .demo-button {

            display: inline-flex;

            align-items: center;

            gap: 10px;

            padding: 14px 28px;

            border-radius: 8px;

            background: #005cb9;

            color: white;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;

            box-shadow:
                0 10px 25px rgba(0, 92, 185, 0.20);

            transition: all 0.25s ease;
        }


        .demo-button svg {

            width: 17px;
            height: 17px;
        }


        .demo-button:hover {

            background: #004d9d;

            transform: translateY(-2px);

            box-shadow:
                0 14px 30px rgba(0, 92, 185, 0.25);
        }



        /* =====================================
           FOOTER
        ===================================== */

        footer {

            position: fixed;

            bottom: 15px;

            left: 0;

            width: 100%;

            text-align: center;

            font-size: 11px;

            color: #a2a6ab;
        }



        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 600px) {

            header {

                padding: 0 20px;
            }


            .header-logo {

                height: 32px;
            }


            .header-right {

                display: none;
            }


            main {

                padding: 35px 18px 70px;
            }


            .logo-area {

                width: min(340px, 90vw);

                height: 160px;
            }


            .logo-area img {

                max-width: 240px;
            }


            .insurance-icons {

                gap: 22px;
            }


            .description {

                font-size: 15px;
            }


            footer {

                position: relative;

                margin-top: 20px;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================
         HEADER
    ===================================== -->

    <header>

        <!--
            SMALL HEADER LOGO

            Put logo.png in this folder.
        -->

        <img
            src="assurantLogo01.png"
            alt="Assurant"
            class="header-logo"
        >


        <div class="header-right">

            <span class="status-dot"></span>

            Product Demonstration

        </div>

    </header>



    <!-- =====================================
         MAIN CONTENT
    ===================================== -->

    <main>

        <div class="container">


            <!-- Label -->

            <div class="eyebrow">

                <i data-lucide="shield-check"></i>

                Insurance Technology

            </div>



            <!-- =================================
                 LARGE CENTER LOGO
            ================================== -->

            <div class="logo-area">

                <!--
                    ==================================
                    ATTACH YOUR LARGE PNG LOGO HERE

                    Example:

                    <img src="assurant-logo.png">

                    Recommended PNG:
                    500px - 800px wide
                    Transparent background
                    ==================================
                -->

                <img
                    src="assurantLogo01.png"
                    alt="Company Logo"
                >

            </div>



            <!-- Heading -->

            <h1>

                Protecting What
                <span>Matters Most</span>

            </h1>


            <p class="description">

                A simple demonstration of technology designed
                to improve protection, visibility, and customer
                experience across modern insurance services.

            </p>



            <!-- =================================
                 INSURANCE CATEGORIES
            ================================== -->

            <div class="insurance-icons">


                <div class="insurance-item">

                    <div class="icon">

                        <i data-lucide="shield-check"></i>

                    </div>

                    Protection

                </div>



                <div class="insurance-item">

                    <div class="icon">

                        <i data-lucide="home"></i>

                    </div>

                    Home

                </div>



                <div class="insurance-item">

                    <div class="icon">

                        <i data-lucide="car-front"></i>

                    </div>

                    Mobility

                </div>



                <div class="insurance-item">

                    <div class="icon">

                        <i data-lucide="heart-pulse"></i>

                    </div>

                    Life & Health

                </div>



                <div class="insurance-item">

                    <div class="icon">

                        <i data-lucide="lock-keyhole"></i>

                    </div>

                    Security

                </div>

            </div>



            <!-- =================================
                 DEMO BUTTON
            ================================== -->

            <!-- <a
                href="#"
                class="demo-button"
            >

                Explore the Demo

                <i data-lucide="arrow-right"></i>

            </a> -->


        </div>

    </main>



    <footer>

        Product Demonstration · Confidential

    </footer>

        lucide.createIcons();
